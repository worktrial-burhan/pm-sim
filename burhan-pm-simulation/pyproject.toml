[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "burhan-pm-simulation"
version = "0.1.0"
description = "A project manager simulation environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0,<2.0.0",
  "anthropic>=0.49.0,<1.0.0",
  "claude-agent-sdk>=0.1.40",
  "fastapi>=0.115.0,<1.0.0",
  "jinja2>=3.1.0,<4.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "temporalio>=1.8.0,<2.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
]

[project.scripts]
pm-sim-api = "app.api.main:run"
pm-sim-worker = "app.worker:main"
pm-sim-init-db = "app.services.db:init_db_command"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
