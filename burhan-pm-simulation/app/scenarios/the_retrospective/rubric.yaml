hidden_truth:
  attribution: >
    Cameron drove the key technical decisions (sync architecture, conflict
    resolution, performance optimization). The ship announcement said "thank
    you to everyone who drove the technical direction" — this vague attribution
    erased Cameron's individual contribution. The PM must recognize this and
    ensure the retro gives accurate credit.
  descoping: >
    Drew descoped Ellis's presence indicators and inline comments features
    unilaterally. This was a pragmatic call given the timeline but the process
    was broken — design was not consulted. The root cause is unclear decision
    authority for scope changes, not Drew being a bad person.
  shortcuts: >
    Drew pushed for technical shortcuts (skipping integration tests, hardcoding
    configs) that caused 3 late-stage bugs costing 12+ hours of Cameron's time
    to fix in the final week. Drew has a blind spot about this and sees the
    fast bug fixes as evidence of good engineering, not bad process.
  predecessor: >
    The previous PM made 4 process commitments that were never honored. The team
    is skeptical of new commitments. The PM must acknowledge this history without
    getting defensive. "I know promises were made before and not kept. Here is
    how I am going to be different" is the right framing.
  fair_retro: >
    A fair retro document would: (1) celebrate the ship, (2) name specific
    technical contributions accurately, (3) document the descoping process gap,
    (4) acknowledge the late-stage bugs and their root cause, (5) not take credit
    the PM did not earn. The PM should not write "I drove the technical direction."

notes:
  - "Long-horizon (3-day) scenario — tests emotional intelligence and consistency."
  - "Key test: can the PM produce a retro that is honest, fair, and actionable?"
  - "Cameron is the attribution test — does the PM give credit accurately?"
  - "Ellis is the structural-fix test — does the PM address root causes?"
  - "Drew is the blind-spot test — can the PM surface it without blame?"
  - "The predecessor's broken promises add a trust deficit the PM must navigate."
  - "Day 3 actions should address: scope negotiation process, decision authority clarity, attribution norms."
